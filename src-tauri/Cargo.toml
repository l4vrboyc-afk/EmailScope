[package]
name = "threatscope"
version = "0.1.0"
description = "ThreatScope: OSINT investigation toolkit"
edition = "2021"
authors = ["ThreatScope Team"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[[bin]]
name = "threatscope"
path = "src/main.rs"
