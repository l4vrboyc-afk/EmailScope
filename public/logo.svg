<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="esBeam" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg-plate { fill: #000000; }
      .v-line { stroke: #ffffff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .v-thin { stroke: #ffffff; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .v-fill { fill: #ffffff; }
      .v-dark { fill: #0a0a0a; }

      /* Scanning Conic Beam Animation */
      .scan-beam {
        fill: url(#esBeam);
        transform-origin: 64px 38px;
        animation: beamSweep 3s ease-in-out infinite alternate;
      }
      @keyframes beamSweep {
        0% { transform: rotate(-5deg); opacity: 0.35; }
        50% { opacity: 0.7; }
        100% { transform: rotate(5deg); opacity: 0.35; }
      }

      /* Radar Wave Pulse Animations */
      .wave-1 {
        transform-origin: 64px 38px;
        animation: wavePulse 2.4s cubic-bezier(0.1, 0.4, 0.8, 1) infinite;
      }
      .wave-2 {
        transform-origin: 64px 38px;
        animation: wavePulse 2.4s cubic-bezier(0.1, 0.4, 0.8, 1) infinite 0.8s;
      }
      .wave-3 {
        transform-origin: 64px 38px;
        animation: wavePulse 2.4s cubic-bezier(0.1, 0.4, 0.8, 1) infinite 1.6s;
      }
      @keyframes wavePulse {
        0% { transform: scale(0.6); opacity: 0; }
        30% { opacity: 0.95; }
        80% { opacity: 0.4; }
        100% { transform: scale(1.4); opacity: 0; }
      }

      /* Reticle Spin Animation */
      .reticle-spin {
        transform-origin: 82px 38px;
        animation: reticleRotate 7s linear infinite;
      }
      @keyframes reticleRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Target Node Pulse Animation */
      .target-pulse {
        animation: targetGlow 1.6s ease-in-out infinite alternate;
      }
      @keyframes targetGlow {
        0% { opacity: 0.4; transform: scale(0.9); transform-origin: 82px 38px; }
        100% { opacity: 1; transform: scale(1.15); transform-origin: 82px 38px; }
      }

      /* Lens Tip Gleam */
      .lens-gleam {
        animation: gleam 2s ease-in-out infinite alternate;
      }
      @keyframes gleam {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Dark Rounded Badge Frame -->
  <rect class="bg-plate" width="100" height="100" rx="20"/>
  <rect x="1" y="1" width="98" height="98" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2"/>

  <!-- OSINT Technical Grid Background (Subtle) -->
  <line x1="10" y1="50" x2="90" y2="50" stroke="#ffffff" stroke-opacity="0.06" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="50" y1="10" x2="50" y2="90" stroke="#ffffff" stroke-opacity="0.06" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- SCANNING BEAM & RADAR WAVE (ANIMATED) -->
  <polygon points="64,38 96,18 96,58" class="scan-beam"/>

  <!-- Pulsing Radar Signal Arcs -->
  <path d="M 71 30 A 10 10 0 0 1 71 46" class="v-thin wave-1" stroke-dasharray="2 2"/>
  <path d="M 77 24 A 18 18 0 0 1 77 52" class="v-thin wave-2" stroke-dasharray="3 2"/>
  <path d="M 83 18 A 26 26 0 0 1 83 58" class="v-thin wave-3" stroke-dasharray="4 3"/>

  <!-- TARGETING RETICLE (ANIMATED SPIN & PULSE) -->
  <g class="reticle-spin">
    <circle cx="82" cy="38" r="9.5" class="v-thin" stroke-dasharray="4 3" stroke-opacity="0.8"/>
    <!-- Reticle Crosshair Ticks -->
    <line x1="82" y1="25" x2="82" y2="28.5" class="v-thin"/>
    <line x1="82" y1="47.5" x2="82" y2="51" class="v-thin"/>
    <line x1="69" y1="38" x2="72.5" y2="38" class="v-thin"/>
    <line x1="91.5" y1="38" x2="95" y2="38" class="v-thin"/>
  </g>

  <!-- Target Locked Entity (@ Node) -->
  <g class="target-pulse">
    <circle cx="82" cy="38" r="2.4" class="v-fill" filter="url(#glow)"/>
    <circle cx="82" cy="38" r="5" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>
  </g>

  <!-- GROUND / BASELINE -->
  <line x1="12" y1="91" x2="88" y2="91" class="v-thin" stroke-opacity="0.25"/>

  <!-- TRIPOD -->
  <!-- Pan-Tilt Head -->
  <rect x="44" y="42" width="7" height="4" rx="1.2" class="v-thin" fill="#000000"/>
  <circle cx="47.5" cy="44" r="1.4" class="v-fill"/>
  <!-- Pan Handle to Investigator Hand -->
  <line x1="44" y1="44.5" x2="35" y2="54" class="v-thin"/>

  <!-- Tripod Apex Mount -->
  <polygon points="47.5,46 43,51 52,51" class="v-thin" fill="#000000"/>

  <!-- 3 Tripod Legs -->
  <line x1="44" y1="51" x2="27" y2="91" class="v-line"/>
  <line x1="47.5" y1="51" x2="47.5" y2="91" class="v-line"/>
  <line x1="51" y1="51" x2="68" y2="91" class="v-line"/>

  <!-- Tripod Stage Tension Clamps -->
  <line x1="33" y1="71" x2="38.5" y2="71" class="v-thin"/>
  <line x1="45" y1="72" x2="50" y2="72" class="v-thin"/>
  <line x1="57" y1="71" x2="62.5" y2="71" class="v-thin"/>

  <!-- SPOTTING SCOPE (HIGH-TECH 2D VECTOR) -->
  <!-- Eyepiece angled up towards eye -->
  <path d="M 33 32 L 38 37 L 42 35 L 37 30 Z" class="v-line" fill="#000000"/>
  <!-- Rubber Eye Cup -->
  <line x1="32" y1="31" x2="34" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Prism Housing & Main Barrel -->
  <path d="M 38 37 L 44 42 L 56 41 L 63 42.5 L 63 33.5 L 56 35 L 42 35 Z" class="v-line" fill="#000000"/>

  <!-- Scope Focus Grip Ring -->
  <line x1="50" y1="35.5" x2="50" y2="41.5" class="v-thin"/>
  <line x1="52" y1="35.5" x2="52" y2="41.5" class="v-thin"/>

  <!-- Objective Lens Bezel & Sunshade -->
  <rect x="62" y="33" width="3" height="10" rx="0.8" class="v-fill lens-gleam" filter="url(#glow)"/>

  <!-- INVESTIGATOR FIGURE (2D VECTOR SILHOUETTE) -->
  <!-- Ponytail (Distinctive silhouette detail from original photo) -->
  <path d="M 21 28 C 17 28 14 32 15 37 C 17.5 36 20 34 21 32" class="v-line" fill="#000000"/>

  <!-- Head & Hair profile (Clean minimalist geometry) -->
  <path d="M 21 32 C 19 28 21 21 27 19.5 C 33 18 36 22 36 26.5 C 36 28 35 30 34 31 C 32 32 30 31 29 29 C 27 29 26 31 26 33 Z" class="v-line" fill="#ffffff"/>

  <!-- Eye line gazing directly into scope ocular -->
  <line x1="30.5" y1="27" x2="33" y2="28" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Nose & Jaw profile toward eyepiece -->
  <path d="M 33 26.5 L 34 29 L 32.5 31" stroke="#000000" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Jacket Collar & Neck -->
  <path d="M 26 34 L 27 39 L 31.5 39" class="v-thin"/>

  <!-- Jacket / Torso Contour -->
  <path d="M 24 39 C 21 46 19 57 18 68 L 26 68 C 27 58 28.5 48 30.5 40" class="v-line" fill="#000000"/>

  <!-- Hand on Pan Handle -->
  <path d="M 28 41 C 30 46 33 50 35.5 54" class="v-line"/>
  <circle cx="35.5" cy="54" r="1.8" class="v-fill"/>

  <!-- Lower Torso & Legs -->
  <path d="M 18 68 L 17 88 L 25 88 L 26 68" class="v-line" fill="#000000"/>
</svg>
